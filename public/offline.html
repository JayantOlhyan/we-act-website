<!DOCTYPE html>
<html lang="en">
<head>
  <meta charSet="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — WeAct Global Solutions</title>
  <meta name="theme-color" content="#F57C20" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    :root {
      --color-primary: #F57C20;
      --color-primary-dark: #D4691A;
      --color-secondary-dark: #0D0D1A;
      --color-secondary: #1A1A2E;
      --color-white: #FFFFFF;
      --color-gray-400: #9CA3AF;
      --color-gray-500: #6B7280;
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--color-secondary-dark);
      color: var(--color-white);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Background Gradients */
    .bg-gradient {
      position: absolute;
      top: -10%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(245, 124, 32, 0.1) 0%, rgba(13, 13, 26, 0) 70%);
      pointer-events: none;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      background: rgba(26, 26, 46, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      padding: 48px 32px;
      text-align: center;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 32px;
      text-decoration: none;
    }

    .logo-brand {
      font-size: 28px;
      font-weight: 800;
      color: var(--color-primary);
      letter-spacing: -0.02em;
    }

    .logo-tagline {
      font-size: 11px;
      font-weight: 600;
      color: var(--color-white);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-top: 4px;
      opacity: 0.8;
    }

    .illustration {
      margin-bottom: 24px;
      color: var(--color-primary);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .illustration svg {
      width: 80px;
      height: 80px;
      filter: drop-shadow(0 0 10px rgba(245, 124, 32, 0.2));
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--color-white);
      letter-spacing: -0.01em;
    }

    p {
      font-size: 15px;
      color: var(--color-gray-400);
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: var(--color-primary);
      color: var(--color-white);
      border: 2px solid var(--color-primary);
      border-radius: 8px;
      padding: 12px 32px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      min-height: 48px;
      transition: all 250ms cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 20px rgba(245, 124, 32, 0.15);
      outline: none;
    }

    .btn:hover:not(:disabled) {
      background-color: var(--color-primary-dark);
      border-color: var(--color-primary-dark);
      box-shadow: 0 0 25px rgba(245, 124, 32, 0.35);
      transform: translateY(-1px);
    }

    .btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-text {
      font-size: 12px;
      color: var(--color-gray-500);
      margin-top: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--color-gray-500);
      display: inline-block;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translate(-50%, 100px);
      background: rgba(239, 68, 68, 0.95);
      color: var(--color-white);
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
      z-index: 1000;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s;
      opacity: 0;
      pointer-events: none;
    }

    .toast.show {
      transform: translate(-50%, 0);
      opacity: 1;
    }

    .toast svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>

  <div class="container">
    <div class="logo">
      <span class="logo-brand">WeAct</span>
      <span class="logo-tagline">Global Solutions</span>
    </div>

    <div class="illustration">
      <!-- Animated Wifi Off Icon -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.5"></path>
        <path d="M5 12.5a10.94 10.94 0 0 1 5.83-2.84"></path>
        <path d="M7.34 6.4a15 15 0 0 1 9.32 0"></path>
        <path d="M1 1v22L23 1"></path> <!-- fallback line diagonal -->
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
        <!-- Offline symbol overlay -->
      </svg>
    </div>

    <h1>You're Offline</h1>
    <p>It looks like your device isn't connected to the internet right now. Some features may be temporarily unavailable.</p>

    <button id="retry-btn" class="btn">Try Again</button>

    <div class="status-text">
      <span class="status-dot"></span>
      Connection will resume automatically when you're back online.
    </div>
  </div>

  <div id="toast" class="toast">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"></circle>
      <line x1="12" y1="8" x2="12" y2="12"></line>
      <line x1="12" y1="16" x2="12.01" y2="16"></line>
    </svg>
    Still offline. Please check your internet connection.
  </div>

  <script>
    const retryBtn = document.getElementById('retry-btn');
    const toast = document.getElementById('toast');

    function checkConnection() {
      if (navigator.onLine) {
        retryBtn.disabled = true;
        retryBtn.textContent = 'Reconnecting...';
        // Attempt to reload the original page that triggered the offline view.
        // The service worker will try to load from network first.
        window.location.reload();
      } else {
        // Play error toast
        toast.classList.add('show');
        setTimeout(() => {
          toast.classList.remove('show');
        }, 3000);
      }
    }

    retryBtn.addEventListener('click', checkConnection);

    // Auto-reload when network connectivity is restored
    window.addEventListener('online', () => {
      retryBtn.disabled = true;
      retryBtn.textContent = 'Back Online! Loading...';
      window.location.reload();
    });
  </script>
</body>
</html>
