<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WeAct Global Forms Registry</title>
  </head>
  <body>
    <!-- Static form declarations for Netlify Forms detection with Next.js App Router -->
    <form name="enquiry" data-netlify="true" netlify-honeypot="website_url" hidden>
      <input type="hidden" name="form-name" value="enquiry" />
      <input name="website_url" />
      <input name="name" />
      <input name="company" />
      <input name="role" />
      <input name="phone" />
      <input name="email" />
      <input name="service" />
      <textarea name="message"></textarea>
      <input name="consent" />
      <input name="utm_source" />
      <input name="utm_medium" />
      <input name="utm_campaign" />
      <input name="utm_content" />
      <input name="landing_page" />
      <input name="referrer" />
      <input name="submitted_at" />
      <input name="source_page" />
    </form>

    <form name="company-profile" data-netlify="true" netlify-honeypot="website_url" hidden>
      <input type="hidden" name="form-name" value="company-profile" />
      <input name="website_url" />
      <input name="name" />
      <input name="company" />
      <input name="role" />
      <input name="phone" />
      <input name="consent" />
      <input name="utm_source" />
      <input name="utm_medium" />
      <input name="utm_campaign" />
      <input name="utm_content" />
      <input name="landing_page" />
      <input name="referrer" />
      <input name="submitted_at" />
      <input name="source_page" />
    </form>
  </body>
</html>
